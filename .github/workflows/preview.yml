name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  STAGE: pr-${{ github.event.number }}
  PULL_REQUEST: ${{ github.event.number }}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load preview secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: packages/infra/preview-secrets.env.tpl
      - name: Require preview secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALCHEMY_PASSWORD BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing 1Password value $name"
              exit 1
            fi
          done
      - name: Deploy preview
        run: pnpm --filter @horkos/infra exec alchemy deploy --stage "$STAGE" --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check stage
        run: |
          case "$STAGE" in
            pr-*) ;;
            *) echo "::error::Refusing to destroy non-preview stage"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load preview secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: packages/infra/preview-secrets.env.tpl
      - name: Require preview secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALCHEMY_PASSWORD BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing 1Password value $name"
              exit 1
            fi
          done
      - name: Destroy preview
        run: pnpm --filter @horkos/infra exec alchemy destroy --stage "$STAGE" --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
